<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>留格 · IG 主頁排版助理（原型）</title>
  <meta name="description" content="幫你變會拍、會選、會排。不生成任何圖片，照片永遠是你的。">
  <meta name="theme-color" content="#F6F2EC">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23F6F2EC%22/%3E%3Cpath d=%22M5.5 2v12M10.5 2v12M2 5.5h12M2 10.5h12%22 stroke=%22%238A6F5A%22/%3E%3C/svg%3E">
  <!-- 免費的 Google Fonts；離線時會退回系統字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>

  <header class="top" id="top">
    <div class="top-in">
      <a class="brand" href="#/" aria-label="留格 首頁">
        <span class="brand-name">留格</span>
        <span class="brand-sub">IG 主頁排版助理</span>
      </a>
      <div class="top-right">
        <div class="top-nav" id="topNav" hidden>
          <button class="back" id="backBtn" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
            上一步
          </button>
          <span class="step-count" id="stepCount" aria-live="polite">01 / 05</span>
        </div>
        <a class="music-link" id="musicLink" href="#/music" aria-label="配樂偏好" title="配樂偏好">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12.2V3.2l7-1.4v8.6"/><ellipse cx="4.3" cy="12.3" rx="1.8" ry="1.4"/><ellipse cx="11.3" cy="10.5" rx="1.8" ry="1.4"/></svg>
          <span class="ml-text">配樂</span>
        </a>
      </div>
    </div>
    <div class="progress" id="progress" aria-hidden="true"><span id="progressBar"></span></div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <span>原型 · 示範用</span>
    <span class="foot-dot" aria-hidden="true">·</span>
    <span>照片只在你的裝置上處理</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 一般 script（非 ES module），雙擊 index.html 也能直接開 -->
  <!-- JSZip 3.10.2（MIT／GPLv3 雙授權，本地檔，不連網路）：第 5 步「打包成 zip 下載」 -->
  <script src="vendor/jszip.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/music-library.js"></script>
  <script src="js/music.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/grid-detect.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
